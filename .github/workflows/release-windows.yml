name: Build and publish CONIK for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build CONIK desktop installer
        run: pnpm desktop:build
      - name: Find NSIS installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path . -Recurse -Filter *.exe | Where-Object { $_.FullName -match 'target\\release\\bundle\\nsis' } | Select-Object -First 1
          if (-not $installer) { throw 'CONIK Windows installer (.exe) was not produced.' }
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: CONIK School Management v0.1.0
          generate_release_notes: true
          files: ${{ steps.installer.outputs.path }}
          fail_on_unmatched_files: true
